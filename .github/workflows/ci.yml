name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The script needs bash 5 (macOS ships 3.2), so Linux only. 22.04 is the
    # older tools: jq 1.6, bash 5.1, tmux 3.2a, fish 3.3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # jq, shellcheck and script (util-linux) are in the runner image
      - name: Install the test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q zsh fish tmux parallel
          if [[ "${{ matrix.os }}" == ubuntu-24.04 ]]; then
            sudo apt-get install -y -q bats just
          fi

      # apt's bats on 22.04 (1.2) is too old for the suite: the newest release
      # instead, so it never goes stale (Dependabot moves the action)
      - name: Install bats (22.04)
        if: matrix.os == 'ubuntu-22.04'
        uses: bats-core/bats-action@4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Tool versions
        run: |
          bash --version | head -1
          jq --version
          shellcheck --version | sed -n 2p
          bats --version
          zsh --version
          tmux -V
          fish --version

      # Findings differ between shellcheck versions: one is enough
      - name: Lint
        if: matrix.os == 'ubuntu-24.04'
        run: just lint

      # In parallel (GNU parallel is installed above); the tmux files keep
      # their own tests one at a time
      - name: Test
        run: bats --jobs "$(nproc)" test
